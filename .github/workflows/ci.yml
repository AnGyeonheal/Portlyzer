name: Validate Portlyzer

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: portlyzer
          POSTGRES_PASSWORD: ci-ephemeral-password
          POSTGRES_DB: portlyzer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portlyzer -d portlyzer_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://portlyzer:ci-ephemeral-password@127.0.0.1:5432/portlyzer_test?schema=public
      BETTER_AUTH_URL: http://127.0.0.1:3100
      BETTER_AUTH_SECRET: ci-only-ephemeral-secret-not-a-production-credential
      ENABLE_DEMO: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx playwright test tests/e2e/restart.spec.ts
        env:
          RUN_RESTART_PROBE: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: |
            playwright-report
            test-results
          retention-days: 5
